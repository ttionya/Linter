name: 'GitHub Release'

on:
  push:
    tags:
      - '**@*.*.*'
      - '!**@*.*.*-*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release

    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Release
        uses: softprops/action-gh-release@v2
